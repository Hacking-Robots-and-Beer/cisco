services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cisco
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: cisco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cisco"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cisco:changeme@postgres:5432/cisco?sslmode=disable
      ENCRYPTION_KEY: "00000000000000000000000000000000"
      GIN_MODE: debug
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api

volumes:
  postgres_data:
